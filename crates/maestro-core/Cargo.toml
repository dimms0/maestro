[package]
name = "maestro-core"
description = ""

license.workspace = true
edition.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
libloading = "0.9"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
midi-parser = { path = "../midi-parser" }
hound = "3.5"
cpal = "0.18"
crossbeam-channel = "0.5"
spin_sleep = "1.3"
directories = "6.0"
interprocess = "2.4"
fundsp = { version = "0.23", default-features = false, features = ["std"] }
notify-rust = "4.11"

notify = { version = "8.0", optional = true }

flacenc = { version = "0.5", optional = true }
mp3lame-encoder = { version = "0.2", optional = true }
vorbis_rs = { version = "0.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["jack", "pipewire", "pulseaudio"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "event_sender"
harness = false

[features]
config-watcher = ["dep:notify"]
encoders = ["dep:flacenc", "dep:mp3lame-encoder", "dep:vorbis_rs"]

jack = ["cpal/jack"]
asio = ["cpal/asio"]
