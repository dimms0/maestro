[package]
name = "maestro-gui"
description = "A MIDI synthesizer host"

license.workspace = true
edition.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "maestro"
path = "src/main.rs"

[dependencies]
maestro-core = { path = "../maestro-core", features = ["encoders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0.0"
midi-parser = { path = "../midi-parser" }
rayon = "1.12"
slint = { version = "~1.17", features = ["unstable-winit-030"] }
rfd = "0.17"
libloading = "0.9"
ureq = { version = "3", optional = true, features = ["json"] }

[features]
default = ["update-check"]
update-check = ["dep:ureq"]

[build-dependencies]
slint-build = "~1.17"
# Used only when the target is Windows; see build.rs.
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
maestro-core = { path = "../maestro-core", features = ["asio"] }

[package.metadata.deb]
maintainer = "dimms"
copyright = "2026, dimms"
license-file = ["../../LICENSE.md", "0"]
extended-description = "A MIDI synthesizer host."
depends = "$auto, libfluidsynth3"
section = "sound"
priority = "optional"
assets = [
    [
        "target/release/maestro",
        "usr/bin/",
        "755",
    ],
    [
        "target/release/maestrod",
        "usr/bin/",
        "755",
    ],
    [
        "../maestro-daemon/service/maestrod.service",
        "usr/lib/systemd/user/",
        "644",
    ],
    [
        "../../packaging/linux/gr.dimms.maestro.desktop",
        "usr/share/applications/",
        "644",
    ],
    [
        "../../assets/logo/maestro-app-icon.svg",
        "usr/share/icons/hicolor/scalable/apps/gr.dimms.maestro.svg",
        "644",
    ],
    [
        "../../assets/logo/linux/maestro-16.png",
        "usr/share/icons/hicolor/16x16/apps/gr.dimms.maestro.png",
        "644",
