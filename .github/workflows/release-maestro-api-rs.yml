name: Release maestro-api-rs

# The Rust bindings release on their own tags, e.g. maestro-api-rs-v0.1.0,
# apart from Maestro's v* tags (which ship the library and maestro.h).
on:
  push:
    tags: ["maestro-api-rs-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Holds the trusted-publishing grant; add required reviewers to it on
    # GitHub to approve each release by hand.
    environment: crates-io
    permissions:
      id-token: write # crates.io trusted publishing
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches the crate version
        id: version
        run: |
          tag=${GITHUB_REF_NAME#maestro-api-rs-v}
          crate=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "maestro-api-rs") | .version')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but crates/maestro-api-rs/Cargo.toml says $crate"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - run: cargo test -p maestro-api-rs --locked

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p maestro-api-rs --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Not marked latest, so the app's release keeps that spot.
      - uses: softprops/action-gh-release@v2
        with:
          name: maestro-api-rs v${{ steps.version.outputs.version }}
          make_latest: false
          generate_release_notes: true
